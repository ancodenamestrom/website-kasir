<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Restaurant POS | Beranda</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #f9fafb;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .22), transparent 35%),
        linear-gradient(135deg, #111827, #0b1220 65%, #172554);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .container { width: min(900px, 100%); }
    .brand { text-align: center; margin-bottom: 38px; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 18px;
      display: grid; place-items: center; border-radius: 20px;
      background: #2563eb; font-size: 30px;
      box-shadow: 0 12px 35px rgba(37, 99, 235, .3);
    }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 42px); }
    .subtitle { margin: 0; color: #aab5c7; line-height: 1.6; }
    .cards {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      display: block; padding: 28px; min-height: 230px;
      color: inherit; text-decoration: none;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; transition: .2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,.10);
      border-color: rgba(96,165,250,.65);
    }
    .icon {
      width: 54px; height: 54px; display: grid; place-items: center;
      border-radius: 15px; background: rgba(59,130,246,.18);
      font-size: 26px; margin-bottom: 22px;
    }
    .card h2 { margin: 0 0 9px; font-size: 22px; }
    .card p { margin: 0 0 22px; color: #aab5c7; line-height: 1.55; }
    .link { color: #93c5fd; font-weight: 700; }
    footer { text-align: center; margin-top: 30px; color: #7f8ba0; font-size: 13px; }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .card { min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="logo" aria-hidden="true">🍽️</div>
      <h1>Restaurant POS</h1>
      <p class="subtitle">Pilih halaman yang ingin kamu buka.</p>
    </header>

    <section class="cards" aria-label="Menu utama">
      <a class="card" href="dashboard.html">
        <div class="icon" aria-hidden="true">📊</div>
        <h2>Dashboard</h2>
        <p>Lihat ringkasan penjualan, transaksi, dan informasi operasional restoran.</p>
        <span class="link">Buka Dashboard →</span>
      </a>

      <a class="card" href="kasir.html">
        <div class="icon" aria-hidden="true">🛒</div>
        <h2>Kasir</h2>
        <p>Buka halaman kasir untuk memasukkan pesanan dan memproses transaksi.</p>
        <span class="link">Buka Kasir →</span>
      </a>
    </section>

    <footer>Restaurant POS System</footer>
  </main>
</body>
</html>
